name: exo1

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          # cache: npm # Permet de faire la même chose que l'action de cache mais uniquement pour npm.

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm test

      - if: always() # Vous permet d'exécuter la step même si les commandes au dessus échouent.
        # Implicitement toutes les steps ont un : if: success()
        run: |
          echo "## Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Status : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
